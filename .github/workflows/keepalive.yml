name: Supabase keep-alive

on:
  schedule:
    - cron: '0 3 */3 * *'   # TODO: every N days. Pause happens at 7 days, so pick N with a safety margin
  workflow_dispatch:            # lets you run it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the cafes table
        run: |
          curl -f "${{ secrets.SUPABASE_URL }}/rest/v1/cafes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"